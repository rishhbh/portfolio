    <script>
      var r = document.documentElement;
      r.classList.add('js');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('anim');
      var path = window.location.pathname;
      var hash = window.location.hash.slice(1);
      var darkSections = ['projects', 'skills', 'contact'];
      var isDark = darkSections.some(function(s) { return path.indexOf(s) > -1 || hash.indexOf(s) > -1; });
      r.dataset.tone = isDark ? 'dark' : 'light';
    </script>
